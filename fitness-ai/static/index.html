<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自然健美 AI</title><style>body{font:17px system-ui;background:#101827;color:#f0f5ff;max-width:580px;margin:auto;padding:20px}section{background:#1d2b40;border-radius:16px;padding:18px;margin:16px 0}input,select,button{font:inherit;padding:12px;margin:5px 0;border-radius:9px;border:0;max-width:100%}input,select{background:#eaf0f7;color:#172034}button{background:#67e1b4;color:#102820;font-weight:bold}small{color:#b9c8dd}#timer{font-size:55px;text-align:center;font-variant-numeric:tabular-nums}li{margin:9px 0}</style><h1>自然健美 AI 🏋️</h1><small>私人训练记录 · 初版</small><section><h2>训练记录</h2><select id="exercise"><option>史密斯卧推</option><option>上斜器械推胸</option><option>绳索三头下压</option><option>高位下拉</option><option>坐姿划船</option><option>腿举</option><option>哑铃侧平举</option></select><p>重量 kg <input id="weight" type="number" min="0" max="1000" value="30"> 次数 <input id="reps" type="number" min="1" max="200" value="10"></p><button id="save">完成一组 · 开始休息</button><p id="status"></p></section><section><h2>休息倒计时</h2><select id="rest"><option value="60">60秒</option><option value="90">90秒</option><option value="120" selected>120秒</option><option value="180">180秒</option></select><div id="timer">02:00</div><button id="start">开始/重置</button> <button id="pause">暂停</button><p><small>锁屏后不保证声音提醒</small></p></section><section><h2>身体打卡</h2><p>体重 kg <input id="bodyweight" type="number" step=".1" placeholder="80"> 睡眠 h <input id="sleep" type="number" step=".5" placeholder="7.5"> 疲劳 1–10 <input id="fatigue" type="number" min="1" max="10" placeholder="5"></p><button id="checkin">保存打卡</button></section><section><h2>训练历史</h2><ul id="history"></ul></section><form method="post" action="/api/logout"><button>退出登录</button></form><script>
const $=id=>document.getElementById(id);let remaining=120,end=0,tick=null;const today=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};function paint(){$('timer').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0')}function stop(){clearInterval(tick);tick=null}function start(){stop();remaining=Number($('rest').value);end=Date.now()+remaining*1000;paint();tick=setInterval(()=>{remaining=Math.max(0,Math.ceil((end-Date.now())/1000));paint();if(!remaining){stop();$('status').textContent='休息结束'}},250)}$('start').onclick=start;$('pause').onclick=stop;$('rest').onchange=()=>{stop();remaining=Number($('rest').value);paint()};async function req(path,data){let r=await fetch('/api/'+path,{method:data?'POST':'GET',headers:{'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});if(!r.ok)throw Error('请求失败 '+r.status);return r.json()}async function history(){let a=await req('sets');$('history').replaceChildren(...a.map(x=>{let li=document.createElement('li');li.textContent=x.date+' · '+x.exercise+' '+x.weight+'kg × '+x.reps;return li}))}$('save').onclick=async()=>{try{await req('sets',{date:today(),exercise:$('exercise').value,weight:Number($('weight').value),reps:Number($('reps').value)});$('status').textContent='已保存';start();history()}catch(e){$('status').textContent=e.message}};$('checkin').onclick=async()=>{try{let v=id=>$(id).value===''?null:Number($(id).value);await req('checkins',{date:today(),weight:v('bodyweight'),sleep:v('sleep'),fatigue:v('fatigue')});$('status').textContent='身体数据已保存'}catch(e){$('status').textContent=e.message}};history().catch(e=>$('status').textContent=e.message);
</script></html>
